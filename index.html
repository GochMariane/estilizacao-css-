<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oficina de CSS - Cartão Interativo</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>Estudos de Botânica</h1>
  </header>

  <main>
    <div class="cartao">
      <h2>Botânica</h2>

      <!-- IMAGEM CENTRAL (Usa uma foto de exemplo que já funciona, mas podem trocar o link) -->
      <div class="area-imagem">
        <img 
          src="Botanical.jpg"
          alt="A imagem mostra uma página de pergaminho de um manuscrito botânico medieval" 
          class="foto-destaque"
        >
      </div>

      <p>A Página é dedicada a alguns conhecimentos botânicos.</p>

      <!-- FORMULÁRIO INTERATIVO -->
      <form>
        <h3> Participe da enquete e escolha a próxima planta. .</h3>

        <p>
          <label for="nome-visitante">Seu Nome:</label>
          <input type="text" id="nome-visitante" placeholder="Digite seu nome">
        </p>

        <!-- Exemplo de RADIO (Escolha ÚNICA) -->
        <fieldset>
          <legend>1. Escolha apenas UMA opção favorita:</legend>
          
          <input type="radio" id="op1" name="Camomila" value="opcao1">
          <label for="op1">Camomila</label><br>

          <input type="radio" id="op2" name="Alecrim" value="opcao2">
          <label for="op2">Alecrim</label>
        </fieldset>

        <!-- Exemplo de CHECKBOX (Escolha MÚLTIPLA - Novidade!) -->
        <fieldset>
          <legend>2. Marque TODAS as opções gostaria de serem abordadas (Checkbox):</legend>

          <input type="checkbox" id="check1" name="interesses" value="item1">
          <label for="check1">raizes</label><br>

          <input type="checkbox" id="check2" name="interesses" value="item2">
          <label for="check2">folhas</label><br>

          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">caule</label>
        </fieldset>

        <button type="submit">Enviar Respostas</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Atividade de fixação de CSS - 2026</p>
  </footer>

</body>
</html>
